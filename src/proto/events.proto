syntax = "proto3";
package eventspb;

message MatchFound {
    string room_id          = 1;
    string partner_id       = 2;
    string partner_avatar   = 3;
    string partner_location = 4;
    string partner_username = 5;
    bool   is_friend        = 6; // Indicates whether the matched stranger is already a friend
}

message StrangerDisconnected {
    string room_id = 1;
}

// MsgType "friend_accepted" — sent to both users when a friend request is accepted
// (room_id set when it came from a stranger match); dm_room_id is the new DM room.
message FriendAccepted {
    string room_id    = 1;
    string dm_room_id = 2;
    string user_id    = 3; // the other (new) friend's userID
    string username   = 4;
    string name       = 5;
    string avatar_url = 6;
}

// MsgType "friend_request" — someone sent you a friend request
// (room_id set when this originates from a stranger match).
message FriendRequest {
    string from       = 1; // sender userID
    string room_id    = 2;
    string username   = 3;
    int64  request_id = 4; // needed for accept/reject
    string name       = 5;
    string avatar_url = 6;
}

// MsgType "friend_request_withdrawn"
message FriendRequestWithdrawn {
    string from = 1;
}

// MsgType "friend_request_rejected"
message FriendRequestRejected {
    string from = 1; // the user who rejected the request
}

// MsgType "unfriend"
message Unfriended {
    string user_id = 1; // the user who removed the friendship
    string room_id = 2; // the deleted DM room, if one existed
}

// MsgType "room_closed"
message RoomClosed {
    string room_id = 1;
}

// MsgType "stream_live" (server -> streamer only)
message StreamLive {
    string stream_id = 1;
    string room_id   = 2;
}

// Stranger photo sharing (request/approve, relay-free — the actual bytes go
// direct client<->R2 via presigned URLs, never through the backend).

// MsgType "photo_request"
message PhotoRequest {
    string room_id = 1;
    string from    = 2; // requester userID
}

// MsgType "photo_response"
message PhotoResponse {
    string room_id  = 1;
    string from     = 2; // responder userID
    bool   accepted = 3;
}

// MsgType "photo_ready"
message PhotoReady {
    string room_id    = 1;
    string from       = 2; // uploader userID
    string url        = 3; // presigned GET URL, short-lived
    int64  expires_at = 4; // epoch ms when the URL/object expires
}

// MsgType "gift" — viewer request
message GiftRequest {
    int32  gift_id = 1;
    string message = 2;
}

// MsgType "gift_sent" — broadcast to entire stream room
message GiftSentEvent {
    string sender_id           = 1;
    string creator_id          = 2;
    int32  gift_id             = 3;
    string gift_name           = 4;
    string gift_icon           = 5;
    int32  coins               = 6;
    string message             = 7;
    string sender_username     = 8;
    string sender_name         = 9;
    string sender_avatar_url   = 10;
}

// MsgType "viewer_count" — broadcast to stream room every ~5s
message ViewerCountEvent {
    int64 viewer_count = 1;
}

// MsgType "stream_earnings" — sent to creator only, every ~5s during stream
message StreamEarningsEvent {
    int64 earnings_coins = 1;
}

// MsgType "stream_ending_soon" — sent to creator only, ~2min before auto-end
message StreamEndingSoonEvent {
    string stream_id           = 1;
    int64  seconds_remaining   = 2;
}

// MsgType "stream_auto_ended" — sent to creator only when stream auto-ends
message StreamAutoEndedEvent {
    string stream_id = 1;
    string room_id   = 2;
    // "planned_end": ran past its planned end + grace period.
    // "publisher_gone": the publisher stayed disconnected past the stream's pause timeout.
    string reason    = 3;
}

// MsgType "gift_confirm" — sent only to gift sender (private ack)
message GiftConfirm {
    int32 gift_id       = 1;
    int32 coins         = 2;
    int64 balance_coins = 3;
}

// MsgType "stream_ended" — broadcast to the stream room
message StreamEnded {
    string stream_id = 1;
    string room_id   = 2;
}

// MsgType "stream_paused" — the streamer's video dropped (stream room)
message StreamPaused {
    string stream_id = 1;
}

// MsgType "stream_resumed" — the streamer is back (stream room)
message StreamResumed {
    string stream_id = 1;
}

// MsgType "creator_live" — to followers, once when a stream goes live
message CreatorLive {
    string creator_id = 1;
    string username   = 2;
    string name       = 3;
    string avatar_url = 4;
    string stream_id  = 5;
    string room_id    = 6;
    string title      = 7;
}

// MsgType "retract_message" — creator request
message RetractMessageRequest {
    string message_id = 1;
}

// MsgType "message_retracted" — broadcast to the stream room
message MessageRetracted {
    string message_id = 1;
}

// MsgType "mute_user" — creator request; minutes 0 means rest of the stream
message MuteUserRequest {
    string user_id = 1;
    int32  minutes = 2;
}

// ---------- Stream entry over the WebSocket. Every answer goes only to the
// socket that asked (like gift_confirm) and carries the stream_id it answers. ----------

// MsgType "stream_enter" (client -> server). Gets a playback ticket, and renews
// it when sent again before expires_at. Never charges unless confirm is true.
message StreamEnterRequest {
    string stream_id = 1;
    bool   confirm   = 2; // true only from the viewer's Unlock click on a premium stream
}

// MsgType "stream_enter_ok" (server -> asking socket only)
message StreamEnterOk {
    string stream_id     = 1;
    string playback_url  = 2; // CDN link carrying a short-lived ticket
    int64  expires_at    = 3; // unix seconds; send stream_enter again before this
    int32  charged_coins = 4; // the entry fee, only on the request that paid it
    int64  balance_coins = 5; // the viewer's balance; valid only when has_balance
    bool   has_balance   = 6; // true when this request touched the wallet (paid, or found already paid)
}

// MsgType "stream_confirm_required" (server -> asking socket only). Premium
// stream not paid yet and confirm was false: nothing was charged.
message StreamConfirmRequired {
    string stream_id         = 1;
    int32  entry_price_coins = 2;
}

// MsgType "stream_enter_error" (server -> asking socket only)
message StreamEnterError {
    string stream_id     = 1;
    string code          = 2; // LOGIN_REQUIRED, INSUFFICIENT_BALANCE, STREAM_NOT_FOUND, STREAM_NOT_LIVE, ENTER_FAILED
    string message       = 3;
    int64  balance_coins = 4; // INSUFFICIENT_BALANCE: the viewer's balance; valid only when has_balance
    bool   has_balance   = 5;
}

// MsgType "stream_expired" (server -> creator only). A scheduled stream that
// was never started passed its planned end and can no longer go live.
message StreamExpired {
    string stream_id = 1;
    string title     = 2;
}

// MsgType "purchase_completed" (server -> buyer). Sent once the Razorpay
// webhook has credited the coins; replaces polling the order status.
message PurchaseCompleted {
    string order_id      = 1;
    int32  coins         = 2;
    int64  balance_coins = 3;
}
