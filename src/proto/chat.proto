syntax = "proto3";
package chatpb;

message MetaData {
    string from = 1;
    string from_name = 2;
    string from_avatar_url = 3;
    string conn_id = 4;
    bool   is_guest = 5; // sender logged in as a guest
}

message Envelope {
    string type     = 1;
    string room_id  = 2;
    string to       = 4;
    bytes  payload  = 5;
    int64  ts       = 6;
    string id       = 7;
    MetaData meta_data = 10;
}

// 🛠️ NEW: Define the nested reply object
message ReplyInfo {
    string id = 1;
    string sender_id = 2;
    string content = 3;
}

message ChatMessage {
    string text        = 1;
    string media_url   = 2;
    string media_type  = 3;
    string reply_to_id = 4; // 🛠️ Use this when SENDING to the backend
    ReplyInfo reply_to = 5; // 🛠️ Use this when RECEIVING from the backend
}

message TypingEvent {
    string user_id = 1;
    string room_id = 2;
}

message Receipt {
    string message_id = 1;
    string user_id    = 2;
    string room_id    = 3;
    string status     = 4;
    int64  ts         = 5;
}

message SystemEvent {
    string code    = 1;
    string message = 2;
}

// Online status of many users in one message.
//   type="presence_snapshot": sent once after the socket connects, in parts of
//     up to 1000 users; together the parts list every friend (DM partner) online
//     right now. complete is true on the last part.
//   type="presence_batch" (room_id set): users of that DM who came online or went
//     offline since the previous batch. Our own ID can appear (other devices); ignore it.
message PresenceList {
    repeated string online   = 1;
    repeated string offline  = 2;
    bool            complete = 3;
}

// MsgType "recent_messages" — live-stream chat history sent after join_room
message RecentMessages {
    repeated bytes envelopes = 1; // oldest first; each is a full Envelope
}